name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install SymPy for the calculator tests
        run: python -m pip install sympy==1.14.0
      - run: npm ci
      - run: npm test
      # Build the AppImage to catch packaging errors, but never publish from here
      # (electron-builder publishes implicitly when it detects CI).
      - name: Smoke-pack Linux (no bundled Python download)
        run: TRIM_SKIP_BUNDLED_PYTHON=1 npm run build:linux -- --publish never
